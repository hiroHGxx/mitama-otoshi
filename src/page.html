<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>御霊おとし — 月蝕綺譚 二次創作ファンゲーム</title>
<meta name="description" content="ちび御霊を壺に落として浄化合体、満月を目指す落ち物パズル。『月蝕綺譚 -Luna Occulta-』非公式二次創作ファンゲーム。スマホでそのまま遊べます。">
<meta property="og:title" content="御霊おとし">
<meta property="og:description" content="ちび御霊を落として浄化合体、満月を目指す落ち物パズル。『月蝕綺譚 -Luna Occulta-』二次創作ファンゲーム。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hirohgxx.github.io/mitama-otoshi/">
<meta property="og:image" content="https://hirohgxx.github.io/mitama-otoshi/ogp.png?v=2">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hirohgxx.github.io/mitama-otoshi/ogp.png?v=2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='none' stroke='%23C93A2E' stroke-width='12' stroke-linecap='round' stroke-dasharray='159 80' transform='rotate(-58 50 50)'/><circle cx='50' cy='50' r='17' fill='%23F0CE7E'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=M+PLUS+Rounded+1c:wght@800&display=swap">
<style>
  /* 夜に committed な単一テーマ（公式トンマナ「宵闇に金」の実装トークンに準拠） */
  :root {
    --night: #131320;    /* 宵闇藍 */
    --night-2: #1B1B2E;  /* 宵闇藍・明 */
    --panel: #100E1C;
    --line: #4a4468;
    --ink: #E8E4D8;      /* 月白 */
    --ink-dim: #9D93B5;
    --moon: #F0CE7E;     /* 金泥・高輝度 */
    --kindei: #D9A94C;   /* 金泥 */
    --shokko: #E0562F;   /* 蝕紅: 警告と高揚のみ・面積5%以下 */
    --anshi: #8E6B9E;    /* 暗紫: 夜桜 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; touch-action: none; }
  button { touch-action: manipulation; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px 6px;
  }
  h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .14em;
    background: linear-gradient(160deg, #f6e5ae 20%, #d9b45a 55%, #f2d98c 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
    flex-shrink: 1;
    min-width: 0;
  }
  h1 small {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .22em;
    background: none;
    -webkit-background-clip: initial;
    background-clip: initial;
    color: var(--ink-dim);
  }
  .stats {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    background: linear-gradient(170deg, rgba(28, 24, 54, .85), rgba(19, 16, 38, .9));
    border: 1px solid #6d5a33;
    box-shadow: 0 0 0 1px rgba(184, 155, 90, .25) inset;
    border-radius: 8px;
    padding: 5px 10px;
  }
  .stat { text-align: right; }
  .stat .label {
    font-size: 9px;
    letter-spacing: .2em;
    color: var(--ink-dim);
  }
  .stat .value {
    font-family: "M PLUS Rounded 1c", "Shippori Mincho B1", sans-serif;
    font-size: 19px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .stat .value.bump { animation: score-bump .18s ease; }
  @keyframes score-bump { 40% { transform: scale(1.22); color: var(--moon); } }
  .next {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .next .label { font-size: 9px; letter-spacing: .25em; color: var(--ink-dim); }
  #next-face {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    background: #fdfbf6;
    object-fit: cover;
  }
  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  canvas { display: block; border-radius: 6px; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 24, .78);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: linear-gradient(170deg, rgba(28, 24, 54, .93), rgba(19, 16, 38, .95));
    border: 1px solid #b89b5a;
    box-shadow: 0 0 0 3px rgba(19, 16, 38, .9), 0 0 0 4px #6d5a33, 0 14px 50px rgba(0, 0, 0, .65);
    border-radius: 10px;
    padding: 32px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: min(92vw, 420px);
    box-sizing: border-box;
    position: relative;
    z-index: 1;
  }
  #final-fuda {
    display: none;
    width: 152px;
    border-radius: 8px;
    border: 2px solid #b89b5a;
    margin: 0 auto;
  }
  /* 満月成就カットイン（必殺アニメが帯の上をシュッと横切る） */
  #cutin {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 15;
    pointer-events: none;
    overflow: hidden;
  }
  #cutin.show { display: flex; }
  #cutin::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 26vh;
    height: 48vh;
    background: linear-gradient(90deg, rgba(10, 10, 24, 0), rgba(10, 10, 24, .88) 10%, rgba(10, 10, 24, .88) 90%, rgba(10, 10, 24, 0));
    animation: band-fade 1.7s ease forwards;
  }
  #cutin img {
    position: relative;
    width: min(94vw, 620px);
    max-height: 46vh;
    object-fit: contain;
    filter: drop-shadow(0 0 44px rgba(242, 217, 140, .45));
    animation: cutin-slide 1.7s cubic-bezier(.2, .8, .25, 1) forwards;
  }
  @keyframes cutin-slide {
    0%   { transform: translateX(125%) rotate(-2deg); }
    13%  { transform: translateX(0) rotate(-2deg); }
    80%  { transform: translateX(-3%) rotate(-2deg); }
    100% { transform: translateX(-140%) rotate(-2deg); }
  }
  @keyframes band-fade { 0% { opacity: 0; } 10% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  /* 皆既月蝕（深紅の帳＋筆文字） */
  #eclipse {
    position: fixed;
    inset: 0;
    display: none;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16vh;
    z-index: 15;
    pointer-events: none;
    background: radial-gradient(circle at 50% 42%, rgba(90, 12, 34, .30), rgba(18, 4, 10, .78));
  }
  #eclipse.show { display: flex; }
  /* 血月の一枚絵（AI生成）: 暗転 → パンチイン → 火の粉 */
  #eclipse .e-dark {
    position: absolute;
    inset: 0;
    background: #060409;
    opacity: 0;
    animation: e-dark 2.4s ease forwards;
  }
  @keyframes e-dark { 0% { opacity: 0; } 9% { opacity: 1; } 88% { opacity: 1; } 100% { opacity: 0; } }
  #eclipse .e-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: e-art-punch 2.15s cubic-bezier(.16, .9, .3, 1) .25s forwards;
  }
  @keyframes e-art-punch {
    0%   { transform: scale(1.16); opacity: 0; }
    9%   { transform: scale(1.0); opacity: 1; }
    86%  { transform: scale(1.03); opacity: 1; }
    100% { transform: scale(1.035); opacity: 0; }
  }
  #eclipse .e-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(224, 86, 47, .50), transparent 60%);
    opacity: 0;
    animation: e-flash 2.4s ease .25s forwards;
  }
  @keyframes e-flash { 0% { opacity: 0; } 6% { opacity: 1; } 30% { opacity: 0; } 100% { opacity: 0; } }
  .e-embers { position: absolute; inset: 0; overflow: hidden; }
  .e-embers span {
    position: absolute;
    bottom: -4vh;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe9a8, #e8a04c);
    opacity: 0;
    animation: ember-rise var(--dur, 2s) ease-out var(--delay, .4s) forwards;
  }
  @keyframes ember-rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: .95; }
    100% { transform: translateY(-72vh) translateX(var(--sway, 20px)); opacity: 0; }
  }
  /* 発動時の画面の揺れ */
  main.shake { animation: shake .5s ease; }
  @keyframes shake {
    12% { transform: translate(4px, -3px); }
    30% { transform: translate(-4px, 3px); }
    48% { transform: translate(3px, 2px); }
    66% { transform: translate(-2px, -2px); }
    84% { transform: translate(1px, 1px); }
  }
  @keyframes e-zoom {
    0%   { transform: scale(1.24); opacity: 0; }
    18%  { transform: scale(1); opacity: 1; }
    78%  { opacity: 1; }
    100% { opacity: 0; }
  }
  /* 蝕環: 血月をひと息の筆円相が囲む */
  #eclipse .e-ring {
    position: absolute;
    left: 50%;
    top: 20%;
    width: 76vmin;
    height: 76vmin;
    transform: translate(-50%, -50%);
    opacity: 0;
    filter: drop-shadow(0 0 16px rgba(224, 86, 47, .55));
    animation: e-ring-in 2.15s ease .3s forwards;
  }
  @keyframes e-ring-in {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(1.14) rotate(-9deg); }
    20%  { opacity: .92; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    82%  { opacity: .92; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.01); }
  }
  /* 「皆既月蝕」金文字: 血月の上にズームインで登場 */
  #eclipse .e-text {
    position: relative;
    font-size: clamp(30px, 9vw, 46px);
    font-weight: 800;
    letter-spacing: .35em;
    text-indent: .35em;
    color: var(--moon);
    text-shadow: 0 0 26px rgba(224, 86, 47, .85), 0 0 8px rgba(240, 206, 126, .5), 0 2px 10px rgba(0, 0, 0, .7);
    opacity: 0;
    animation: e-zoom 2.15s cubic-bezier(.16, .9, .3, 1) .45s forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    #cutin.show::before, #cutin img, #eclipse .e-dark, #eclipse .e-art, #eclipse .e-flash, .e-embers span, #eclipse .e-text, #eclipse .e-ring, main.shake { animation: none; }
  }
  @media (max-width: 430px) {
    h1 { font-size: 14px; letter-spacing: .08em; }
    h1 small { font-size: 8px; letter-spacing: .12em; }
    .stats { gap: 8px; }
    .stat .value { font-size: 17px; }
    #next-face { width: 32px; height: 32px; }
    #mute { width: 30px; height: 30px; font-size: 14px; }
    .card { padding: 26px 22px; }
    .howto { font-size: 12px; }
    .game-title { font-size: 28px; }
  }
  .card .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .3em;
    color: var(--shokko);
  }
  .card .sub { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); margin-top: -6px; }
  .card .score-label { font-size: 10px; letter-spacing: .25em; color: var(--ink-dim); }
  #final-score {
    font-family: "M PLUS Rounded 1c", "Shippori Mincho B1", sans-serif;
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--moon);
    line-height: 1.1;
  }
  #final-tier { font-size: 13px; color: var(--ink); letter-spacing: .1em; }
  #retry {
    margin-top: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--night);
    background: var(--moon);
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    cursor: pointer;
  }
  #retry:focus-visible { outline: 3px solid var(--moon); outline-offset: 2px; }
  #mute {
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--moon);
    cursor: pointer;
  }
  #mute.off { color: var(--ink-dim); text-decoration: line-through; }
  #mute:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
  #ladder {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 8px 2px;
  }
  #ladder img, #ladder .moon-tier {
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fdfbf6;
    display: block;
  }
  #ladder .moon-tier {
    background: radial-gradient(circle at 35% 35%, #fff3c8, #e8c96a);
  }
  #ladder .sep { color: var(--ink-dim); font-size: 9px; }
  #title-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--night);
    overflow: hidden;
    z-index: 20;
  }
  /* オープニング: 札絵をゆっくり寄りで見せる */
  #title-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center top;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  #title-overlay.art-in #title-bg { opacity: 1; animation: bg-zoom 9s ease-out forwards; }
  @keyframes bg-zoom { from { transform: scale(1.06); } to { transform: scale(1); } }
  /* 夜の帳: オープニング中は薄く、カード表示で濃くなる */
  #title-overlay::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 10, 24, .30) 0%, rgba(10, 10, 24, .72) 55%, rgba(10, 10, 24, .90) 100%);
    opacity: 0;
    transition: opacity .9s ease;
  }
  #title-overlay.ready::before { opacity: 1; }
  /* カードは少し遅れてふわっと */
  #title-overlay .card {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity .8s ease, transform .8s ease;
    pointer-events: none;
  }
  #title-overlay.ready .card {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  #title-overlay.hidden { display: none; }
  @media (prefers-reduced-motion: reduce) {
    #title-overlay.art-in #title-bg { animation: none; }
  }
  .game-title {
    position: relative;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .3em;
    background: linear-gradient(168deg, #f6e5ae 15%, #D9A94C 55%, #F0CE7E 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(240, 206, 126, .30)) drop-shadow(0 2px 6px rgba(0, 0, 0, .55));
    text-wrap: balance;
  }
  /* タイトルロゴの背後に蝕環（公式の視覚的署名） */
  .card .shokkan {
    position: absolute;
    left: 50%;
    top: 4px;
    width: 100px;
    height: 100px;
    transform: translateX(-50%);
    opacity: .34;
    pointer-events: none;
  }
  .game-sub { font-size: 10px; letter-spacing: .15em; color: var(--ink-dim); margin-top: -6px; }
  .howto {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    text-align: left;
  }
  .howto li::before { content: "〇 "; color: var(--kindei); }
  #start {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .25em;
    color: var(--night);
    background: var(--moon);
    border: none;
    border-radius: 6px;
    padding: 14px 30px;
    cursor: pointer;
  }
  #start:focus-visible { outline: 3px solid var(--moon); outline-offset: 2px; }
  .sound-note { font-size: 10px; letter-spacing: .1em; color: var(--ink-dim); margin-top: -6px; }
  #start-silent {
    font-family: inherit;
    font-size: 12px;
    letter-spacing: .15em;
    color: var(--ink-dim);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 9px 18px;
    cursor: pointer;
  }
  #start-silent:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }
  footer {
    width: 100%;
    text-align: center;
    padding: 4px 12px 10px;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-dim); }
</style>
</head>
<body>
<header>
  <h1>御霊おとし<small>MITAMA OTOSHI</small></h1>
  <div class="stats">
    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="next">
      <div class="label">NEXT</div>
      <img id="next-face" alt="次の御霊">
    </div>
    <button id="mute" aria-label="音の切り替え">♪</button>
  </div>
</header>
<main>
  <canvas id="game"></canvas>
</main>
<div id="ladder" aria-label="浄化の順"></div>
<footer>『月蝕綺譚 -Luna Occulta-』二次創作（非公式ファンゲーム）／ © Studio VIBE のガイドラインに基づく</footer>

<div id="title-overlay">
  <div id="title-bg"></div>
  <div class="card">
    <svg class="shokkan" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#C93A2E" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="167 84" transform="rotate(-58 50 50)"/></svg>
    <div class="game-title">御霊おとし</div>
    <div class="game-sub">— 月蝕綺譚 -Luna Occulta- 二次創作 —</div>
    <ul class="howto">
      <li>なぞって狙い、離して落とす</li>
      <li>同じ御霊が触れると浄化され、次の御霊へ</li>
      <li>御霊を重ね、喰われた月を満たそう</li>
      <li>壺からあふれたら、夜明け</li>
    </ul>
    <button id="start">月夜に入る</button>
    <div class="sound-note">※ 音が鳴ります（イヤホン推奨）</div>
    <button id="start-silent">静かに入る — 音なし</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div class="title">夜が明けた</div>
    <div class="sub">壺から御霊があふれてしまった</div>
    <img id="final-fuda" alt="到達した御霊の札絵">
    <div>
      <div class="score-label">SCORE</div>
      <div id="final-score">0</div>
      <div id="final-tier"></div>
    </div>
    <button id="retry">もう一夜</button>
  </div>
</div>

<div id="cutin"><img id="cutin-img" alt="満月成就"></div>
<div id="eclipse"><div class="e-dark"></div><img class="e-art" id="eclipse-img" alt=""><div class="e-flash"></div><svg class="e-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#C93A2E" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="167 84" transform="rotate(-58 50 50)" opacity=".8"/><circle cx="50" cy="50" r="40" fill="none" stroke="#E0562F" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="167 84" transform="rotate(-58 50 50)"/></svg><div class="e-embers" id="e-embers"></div><div class="e-text">皆既月蝕</div></div>

<script src="vendor/matter.min.js"></script>
<script src="src/bgm.js"></script>
<script src="src/art.js"></script>
<script src="src/faces.js"></script>
<script src="src/game.js"></script>
</body>
</html>
