<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>御霊おとし</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
  /* 夜に committed な単一テーマ */
  :root {
    --night: #12122a;
    --night-2: #1c1836;
    --panel: #232345;
    --line: #4a4468;
    --ink: #f0e8d8;
    --ink-dim: #9d96b8;
    --moon: #f2d98c;
    --sakura: #e5647a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px 6px;
  }
  h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .14em;
    color: var(--moon);
    white-space: nowrap;
    flex-shrink: 1;
    min-width: 0;
  }
  h1 small {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .22em;
    color: var(--ink-dim);
  }
  .stats { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .stat { text-align: right; }
  .stat .label {
    font-size: 9px;
    letter-spacing: .2em;
    color: var(--ink-dim);
  }
  .stat .value {
    font-size: 19px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .next {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .next .label { font-size: 9px; letter-spacing: .25em; color: var(--ink-dim); }
  #next-face {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    background: #fdfbf6;
    object-fit: cover;
  }
  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  canvas { display: block; border-radius: 6px; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 24, .78);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: min(92vw, 420px);
    box-sizing: border-box;
  }
  @media (max-width: 430px) {
    h1 { font-size: 14px; letter-spacing: .08em; }
    h1 small { font-size: 8px; letter-spacing: .12em; }
    .stats { gap: 8px; }
    .stat .value { font-size: 17px; }
    #next-face { width: 32px; height: 32px; }
    #mute { width: 30px; height: 30px; font-size: 14px; }
    .card { padding: 26px 22px; }
    .howto { font-size: 12px; }
    .game-title { font-size: 28px; }
  }
  .card .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .3em;
    color: var(--sakura);
  }
  .card .sub { font-size: 11px; letter-spacing: .12em; color: var(--ink-dim); margin-top: -6px; }
  .card .score-label { font-size: 10px; letter-spacing: .25em; color: var(--ink-dim); }
  #final-score {
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--moon);
    line-height: 1.1;
  }
  #final-tier { font-size: 13px; color: var(--ink); letter-spacing: .1em; }
  #retry {
    margin-top: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--night);
    background: var(--moon);
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    cursor: pointer;
  }
  #retry:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }
  #mute {
    font-family: inherit;
    font-size: 16px;
    line-height: 1;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: transparent;
    color: var(--moon);
    cursor: pointer;
  }
  #mute.off { color: var(--ink-dim); text-decoration: line-through; }
  #mute:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
  #ladder {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 6px 8px 2px;
  }
  #ladder img, #ladder .moon-tier {
    border-radius: 50%;
    border: 2px solid var(--line);
    background: #fdfbf6;
    display: block;
  }
  #ladder .moon-tier {
    background: radial-gradient(circle at 35% 35%, #fff3c8, #e8c96a);
  }
  #ladder .sep { color: var(--ink-dim); font-size: 9px; }
  #title-overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 24, .82);
    z-index: 20;
  }
  #title-overlay.hidden { display: none; }
  .game-title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .3em;
    color: var(--moon);
    text-wrap: balance;
  }
  .game-sub { font-size: 10px; letter-spacing: .15em; color: var(--ink-dim); margin-top: -6px; }
  .howto {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--ink);
    text-align: left;
  }
  .howto li::before { content: "〇 "; color: var(--sakura); }
  #start {
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .25em;
    color: var(--night);
    background: var(--moon);
    border: none;
    border-radius: 6px;
    padding: 14px 30px;
    cursor: pointer;
  }
  #start:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }
  footer {
    width: 100%;
    text-align: center;
    padding: 4px 12px 10px;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-dim); }
</style>
</head>
<body>
<header>
  <h1>御霊おとし<small>MITAMA OTOSHI</small></h1>
  <div class="stats">
    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="next">
      <div class="label">NEXT</div>
      <img id="next-face" alt="次の御霊">
    </div>
    <button id="mute" aria-label="音の切り替え">♪</button>
  </div>
</header>
<main>
  <canvas id="game"></canvas>
</main>
<div id="ladder" aria-label="浄化の順"></div>
<footer>『月蝕綺譚 -Luna Occulta-』二次創作（非公式ファンゲーム）／ © Studio VIBE のガイドラインに基づく</footer>

<div id="title-overlay">
  <div class="card">
    <div class="game-title">御霊おとし</div>
    <div class="game-sub">— 月蝕綺譚 -Luna Occulta- 二次創作 —</div>
    <ul class="howto">
      <li>なぞって狙い、離して落とす</li>
      <li>同じ御霊が触れると浄化され、次の御霊へ</li>
      <li>御霊を重ね、喰われた月を満たそう</li>
      <li>壺からあふれたら、夜明け</li>
    </ul>
    <button id="start">月夜に入る</button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div class="title">夜が明けた</div>
    <div class="sub">壺から御霊があふれてしまった</div>
    <div>
      <div class="score-label">SCORE</div>
      <div id="final-score">0</div>
      <div id="final-tier"></div>
    </div>
    <button id="retry">もう一夜</button>
  </div>
</div>

<script src="vendor/matter.min.js"></script>
<script src="src/bgm.js"></script>
<script src="src/faces.js"></script>
<script src="src/game.js"></script>
</body>
</html>
