<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>御霊おとし</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&display=swap">
<style>
  /* 夜に committed な単一テーマ */
  :root {
    --night: #12122a;
    --night-2: #1c1836;
    --panel: #232345;
    --line: #4a4468;
    --ink: #f0e8d8;
    --ink-dim: #9d96b8;
    --moon: #f2d98c;
    --sakura: #e5647a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Shippori Mincho B1", "Hiragino Mincho ProN", serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px 6px;
  }
  h1 {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .18em;
    color: var(--moon);
  }
  h1 small {
    display: block;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: .22em;
    color: var(--ink-dim);
  }
  .stats { display: flex; align-items: center; gap: 14px; }
  .stat { text-align: right; }
  .stat .label {
    font-size: 9px;
    letter-spacing: .25em;
    color: var(--ink-dim);
  }
  .stat .value {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .next {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .next .label { font-size: 9px; letter-spacing: .25em; color: var(--ink-dim); }
  #next-face {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2.5px solid var(--line);
    background: #fdfbf6;
    object-fit: cover;
  }
  main {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  canvas { display: block; border-radius: 6px; }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 24, .78);
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px 40px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .card .title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: .3em;
    color: var(--sakura);
  }
  .card .score-label { font-size: 10px; letter-spacing: .25em; color: var(--ink-dim); }
  #final-score {
    font-size: 44px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--moon);
    line-height: 1.1;
  }
  #final-tier { font-size: 13px; color: var(--ink); letter-spacing: .1em; }
  #retry {
    margin-top: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .2em;
    color: var(--night);
    background: var(--moon);
    border: none;
    border-radius: 6px;
    padding: 12px 28px;
    cursor: pointer;
  }
  #retry:focus-visible { outline: 3px solid var(--sakura); outline-offset: 2px; }
  footer {
    width: 100%;
    text-align: center;
    padding: 4px 12px 10px;
    font-size: 9px;
    letter-spacing: .1em;
    color: var(--ink-dim);
  }
  footer a { color: var(--ink-dim); }
</style>
</head>
<body>
<header>
  <h1>御霊おとし<small>MITAMA OTOSHI</small></h1>
  <div class="stats">
    <div class="stat">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="label">BEST</div>
      <div class="value" id="best">0</div>
    </div>
    <div class="next">
      <div class="label">NEXT</div>
      <img id="next-face" alt="次の御霊">
    </div>
  </div>
</header>
<main>
  <canvas id="game"></canvas>
</main>
<footer>『月蝕綺譚 -Luna Occulta-』二次創作（非公式ファンゲーム）／ © Studio VIBE のガイドラインに基づく</footer>

<div id="overlay">
  <div class="card">
    <div class="title">夜が明けた</div>
    <div>
      <div class="score-label">SCORE</div>
      <div id="final-score">0</div>
      <div id="final-tier"></div>
    </div>
    <button id="retry">もう一夜</button>
  </div>
</div>

<script src="vendor/matter.min.js"></script>
<script src="src/faces.js"></script>
<script src="src/game.js"></script>
</body>
</html>
