<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  /* 1200x600 (2:1) — X / Slack / Discord 両対応。
     書き出し: Chrome ヘッドレス --window-size=1200,600 --force-device-scale-factor=2 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 600px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(160deg, #12122a 0%, #1c1836 70%, #241d40 100%);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    color: #f0e8d8;
  }
  .moon {
    position: absolute;
    right: -80px;
    top: -60px;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fff3c8, #e8c96a 70%, #d9b45a);
    opacity: .9;
    box-shadow: 0 0 120px 40px rgba(242, 217, 140, .25);
  }
  .crater { position: absolute; border-radius: 50%; background: rgba(180, 150, 80, .3); }
  .content {
    position: absolute;
    left: 80px;
    top: 96px;
  }
  .eyebrow {
    font-size: 22px;
    letter-spacing: .3em;
    color: #9d96b8;
    margin-bottom: 18px;
    white-space: nowrap;
  }
  h1 {
    font-size: 110px;
    font-weight: 800;
    letter-spacing: .12em;
    color: #f2d98c;
    line-height: 1.1;
    white-space: nowrap;
    text-shadow: 0 0 60px rgba(242, 217, 140, .35);
  }
  .tagline {
    margin-top: 22px;
    font-size: 30px;
    letter-spacing: .12em;
    color: #f0e8d8;
    white-space: nowrap;
  }
  .ladder {
    position: absolute;
    left: 80px;
    bottom: 74px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .ladder img {
    border-radius: 50%;
    border: 4px solid;
    background: #fdfbf6;
    flex-shrink: 0;
  }
  .ladder .arrow { color: #9d96b8; font-size: 20px; flex-shrink: 0; }
  .ladder .fullmoon {
    border-radius: 50%;
    border: 4px solid #f2d98c;
    background: radial-gradient(circle at 35% 35%, #fff3c8, #e8c96a);
    flex-shrink: 0;
  }
  .credit {
    position: absolute;
    right: 44px;
    bottom: 28px;
    font-size: 18px;
    letter-spacing: .08em;
    color: #9d96b8;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="moon">
    <div class="crater" style="width:90px;height:90px;left:120px;top:150px"></div>
    <div class="crater" style="width:56px;height:56px;left:300px;top:260px"></div>
    <div class="crater" style="width:44px;height:44px;left:210px;top:80px"></div>
  </div>
  <div class="content">
    <div class="eyebrow">『月蝕綺譚 -Luna Occulta-』二次創作ファンゲーム</div>
    <h1>御霊おとし</h1>
    <div class="tagline">御霊を重ね、喰われた月を満たそう。</div>
  </div>
  <div class="ladder" id="ladder"></div>
  <div class="credit">非公式 / © Studio VIBE のガイドラインに基づく</div>
  <script>
    const chars = ["nemu", "oto", "anne", "nekomata", "benten", "uka", "izuna", "shion", "sakuya"];
    const box = document.getElementById("ladder");
    chars.forEach((n, i) => {
      const img = document.createElement("img");
      img.src = "../assets/faces/" + n + ".png";
      const size = 50 + i * 6;
      img.style.width = img.style.height = size + "px";
      img.style.borderColor = ["#6ec6ff","#c9a15e","#7ac074","#e89a3c","#66d1c1","#f08c5a","#d9c86a","#9a7fd1","#f06292"][i];
      box.appendChild(img);
      const a = document.createElement("span");
      a.className = "arrow";
      a.textContent = "▸";
      box.appendChild(a);
    });
    const m = document.createElement("div");
    m.className = "fullmoon";
    m.style.width = m.style.height = "112px";
    box.appendChild(m);
  </script>
</body>
</html>
